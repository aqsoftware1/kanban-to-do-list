    <title>Kanban Board To-do List by Q</title>
    <style>
        body {
            font-family: "Inter", sans-serif;

<body>
    <div class="hero bg-base-200 min-h-[30vh]">
        <div class="hero-content text-center">
            <div class="max-w-md">
                <h1 class="text-5xl font-bold">To-do List</h1>
                <p class="py-6">
                    A Kanban board inspired to-do list.
                </p>
                <div class="flex justify-center gap-3 flex-wrap">
                    <button type="button" class="btn btn-primary" onclick="addTasks()">Add Tasks</button>
                    <button type="button" class="btn btn-error" onclick="clearAllTasks()">Clear All</button>
                </div>
            </div>
        </div>
    </div>

    <div id="board" class="min-h-[80vh] bg-base-100 flex items-center justify-center p-4 scroll-mt-20">
        <div class="w-full max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="card bg-neutral-900 text-neutral-content w-full shadow-xl">
                <div class="card-body p-8">
                    <h2 class="card-title text-xl mb-3 flex items-center gap-2">
                        To-Do
                    </h2>
                    <div class="divider divider-info"></div>
                    <div class="space-y-6">
                        <ul id="todo" class="list-none min-h-[300px] pb-15">
                        </ul>
                    </div>
                </div>
            </div>
            <div class="card bg-neutral-900 text-neutral-content w-full shadow-xl">
                <div class="card-body p-8">
                    <h2 class="card-title text-xl mb-3 flex items-center gap-2">
                        In progress
                    </h2>
                    <div class="divider divider-warning"></div>
                    <div class="space-y-6">
                        <ul id="inprogress" class="list-none  min-h-[300px] pb-15">
                        </ul>
                    </div>
                </div>
            </div>
            <div class="card bg-neutral-900 text-neutral-content w-full shadow-xl">
                <div class="card-body p-8">
                    <h2 class="card-title text-xl mb-3 flex items-center gap-2">
                        Done
                    </h2>
                    <div class="divider divider-success"></div>
                    <div class="space-y-6">
                        <ul id="done" class="list-none min-h-[300px] pb-15">
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

        <aside>
            <p>Designed by Q</p>
        </aside>

    <script id="to_do_list" type="text/plain">
        <li class="mt-5 mb-5">
            <div class="card w-auto bg-primary-content text-base-content card-sm shadow-sm">
                <div class="card-body p-4">
                    <textarea rows="1" placeholder="Task"
                        class="textarea textarea-ghost bg-primary-content card-title resize-none w-full"
                        maxlength="40"></textarea>
                    <textarea rows="2" placeholder="Description"
                        class="textarea textarea-ghost bg-primary-content resize-none w-full"
                        maxlength="100"></textarea>
                    <div class="justify-end card-actions">
                        <button class="btn btn-sm btn-error" onclick="removeItem(this)">Remove <svg class="size-[1em]"
                            xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <g fill="currentColor">
                                <rect x="1.972" y="11" width="20.056" height="2"
                                    transform="translate(-4.971 12) rotate(-45)"
                                    fill="currentColor" stroke-width="0"></rect>
                                <path
                                    d="m12,23c-6.065,0-11-4.935-11-11S5.935,1,12,1s11,4.935,11,11-4.935,11-11,11Zm0-20C7.038,3,3,7.037,3,12s4.038,9,9,9,9-4.037,9-9S16.962,3,12,3Z"
                                    stroke-width="0" fill="currentColor"></path>
                            </g>
                        </svg></button>
                    </div>
                </div>
            </div>
        </li>
    </script>

    <script>
        const sortableOptions = {
            group: 'shared',
            animation: 150,
            emptyInsertThreshold: 50,
            onSort: updateLists,
            touchStartThreshold: 5,
            delay: 200,
            delayOnTouchOnly: true,
            forceFallback: true,
            scroll: true,
            scrollSensitivity: 100,
            scrollSpeed: 100
        };

        $('#todo, #inprogress, #done').sortable(sortableOptions);

        function getBoardData() {
            const extractTasks = (listId) => {
                const tasks = [];
                $(`#${listId} li`).each(function () {
                    const $li = $(this);
                    tasks.push({
                        title: $li.find('textarea').eq(0).val(),
                        description: $li.find('textarea').eq(1).val()
                    });
                });
                return tasks;
            };
            return {
                todo: extractTasks('todo'),
                inprogress: extractTasks('inprogress'),
                done: extractTasks('done')
            };
        }

        function saveBoardState() {
            const state = getBoardData();
            localStorage.setItem('kanban-board-state', JSON.stringify(state));
        }

        function loadBoardState() {
            const saved = localStorage.getItem('kanban-board-state');
            if (!saved) return;
            try {
                const state = JSON.parse(saved);
                const template = document.getElementById("to_do_list").innerHTML;

                const renderTasks = (listId, tasks) => {
                    const $list = $(`#${listId}`);
                    $list.empty();
                    tasks.forEach(task => {
                        const $item = $(template);
                        $item.find('textarea').eq(0).val(task.title);
                        $item.find('textarea').eq(1).val(task.description);
                        $list.append($item);
                    });
                };

                renderTasks('todo', state.todo || []);
                renderTasks('inprogress', state.inprogress || []);
                renderTasks('done', state.done || []);

            } catch (error) {
                console.log('Could not load saved board state', error);
            }
        }

        function updateLists() {

            $("#todo li .card, #todo textarea")
                .removeClass('bg-primary-content bg-warning bg-accent')
                .addClass('bg-primary-content');

            $("#inprogress li .card, #inprogress textarea")
                .removeClass('bg-primary-content bg-warning bg-accent')
                .addClass('bg-warning');

            $("#done li .card, #done textarea")
                .removeClass('bg-primary-content bg-warning bg-accent')
                .addClass('bg-accent');

            saveBoardState();
        }

        function addTasks() {
            var listitem = document.getElementById("to_do_list").innerHTML;

            $("#todo").append(listitem);
            updateLists();
        }

        function removeItem(button) {
            $(button).closest('li').remove();
            saveBoardState();
        }

        function clearAllTasks() {
            $('#todo').empty();
            $('#inprogress').empty();
            $('#done').empty();
            saveBoardState();
        }

        $(document).on('input', '#todo textarea, #inprogress textarea, #done textarea', function () {
            saveBoardState();
        });

        loadBoardState();
        updateLists();
    </script>
</body>

</html>
